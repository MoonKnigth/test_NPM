name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Build & Deploy (Self-Hosted)
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Required Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint and Build Check (Type Check)
        run: bun run build

      - name: Sync Files to Apps Directory
        run: |
          mkdir -p $HOME/apps/test-npm
          rsync -av --delete --exclude='.git' ./ $HOME/apps/test-npm/

      - name: Deploy Production Container
        run: |
          cd $HOME/apps/test-npm
          docker compose -f docker-compose.prod.yml up -d --build
